name: Deploy Backend

# production 브랜치의 backend 변경을 서버에 자동 재배포한다.
# 서버는 이 저장소를 클론해 두고 production 브랜치를 체크아웃한 상태여야 하며,
# backend/.env(운영값)는 서버에만 존재한다(git 미추적).
#
# 배포 전에 test 잡이 CLAUDE.md의 품질 게이트 4종을 돌린다. 하나라도 실패하면
# deploy 잡이 시작되지 않는다(production 머지 = 배포이므로 여기가 마지막 관문).
on:
  push:
    branches: [production]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  # production으로 향하는 PR에서도 게이트를 돌려 머지 전에 실패를 잡는다(배포는 안 함).
  pull_request:
    branches: [production]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}   # 수동 재배포 허용

jobs:
  test:
    name: 품질 게이트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # uv.lock 그대로 설치(--frozen). 락파일과 pyproject가 어긋나면 여기서 실패한다.
      - name: 의존성 설치
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      # .env 없이 도는지도 함께 검증된다(CI에는 운영 .env가 없다).
      - name: pytest
        run: uv run pytest -q

  deploy:
    needs: test                                   # 게이트 통과 후에만 배포
    if: github.event_name != 'pull_request'       # PR에서는 검증만 하고 배포하지 않음
    runs-on: ubuntu-latest
    # 동시 배포 방지 — 앞선 배포가 끝난 뒤에 다음 배포가 돌도록 큐잉한다.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # production 최신 코드로 강제 동기화 (.env 등 gitignore 파일은 보존됨)
            git fetch origin production
            git reset --hard origin/production

            cd backend
            docker compose -f docker-compose.yml -f compose.prod.yml up -d --build app
            docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.cnu-likelion.kr/healthz; then
              echo "✅ backend healthy"
              exit 0
            fi
            echo "⏳ waiting for backend... ($i/12)"
            sleep 5
          done
          echo "❌ health check failed"
          exit 1
